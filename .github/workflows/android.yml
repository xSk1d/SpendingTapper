name: SpendingTapper

on:
  push:
    branches: [main]
    paths: ['spendingtapper/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['spendingtapper/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spendingtapper
    env:
      # The secrets context cannot be read from a step's `if`, so surface the one
      # flag we branch on as a job-level env var.
      HAS_KEYSTORE: ${{ secrets.SPENDINGTAPPER_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Optional. Without these secrets the release APK is signed with a throwaway
      # debug key, which installs fine but cannot be updated over a previous build.
      # See the README for how to generate the keystore and set the secrets.
      - name: Restore signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SPENDINGTAPPER_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > app/spendingtapper-release.jks

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Build release APK
        env:
          SPENDINGTAPPER_KEYSTORE_FILE: ${{ secrets.SPENDINGTAPPER_KEYSTORE_BASE64 != '' && 'app/spendingtapper-release.jks' || '' }}
          SPENDINGTAPPER_KEYSTORE_PASSWORD: ${{ secrets.SPENDINGTAPPER_KEYSTORE_PASSWORD }}
          SPENDINGTAPPER_KEY_ALIAS: ${{ secrets.SPENDINGTAPPER_KEY_ALIAS }}
          SPENDINGTAPPER_KEY_PASSWORD: ${{ secrets.SPENDINGTAPPER_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove keystore
        if: always()
        run: rm -f app/spendingtapper-release.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spendingtapper-apk
          path: spendingtapper/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: spendingtapper/app/build/reports/
